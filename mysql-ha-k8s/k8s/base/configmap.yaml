apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: redis-ha
data:
  # Redis 主配置（所有节点通用）
  redis.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode no
    save 900 1
    save 300 10
    save 60 10000
    dbfilename dump.rdb
    dir /data
    loglevel notice
    logfile ""
    maxmemory 256mb
    maxmemory-policy allkeys-lru

  # Sentinel 配置（监控 redis-headless 下的 master）
  sentinel.conf: |
    bind 0.0.0.0
    port 26379
    dir /tmp

    # Sentinel 监控 master（quorum=2 表示至少 2 个 Sentinel 同意才故障转移）
    sentinel monitor mymaster redis-0.redis-headless.redis-ha.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 15000
    sentinel parallel-syncs mymaster 1

    # 认证密码
    sentinel auth-pass mymaster Redis@123456
