# Redis 7.2 配置文件 —— 用于 Sentinel 主从架构

# 网络
bind 0.0.0.0
port 6379
protected-mode no

# 认证（密码从环境变量注入时使用占位，实际通过命令行 --requirepass 设置）
# requirepass 和 masterauth 通过 K8s 启动参数动态注入

# 持久化
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# 日志
loglevel notice
logfile ""

# 内存
maxmemory 256mb
maxmemory-policy allkeys-lru
